<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Black Tow - Motorista</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(255, 68, 0, 0.15) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255, 68, 0, 0.1) 0%, transparent 50%), repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.02) 0px, rgba(255, 255, 255, 0.02) 2px, transparent 2px, transparent 8px);
        }

        .login-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            margin: 20px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 48px 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo .logo-icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: inline-block;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {

            0%,
            100% {
                filter: drop-shadow(0 0 0px rgba(255, 68, 0, 0));
                transform: scale(1);
            }

            50% {
                filter: drop-shadow(0 0 20px rgba(255, 68, 0, 0.5));
                transform: scale(1.05);
            }
        }

        .login-logo h1 {
            font-size: 48px;
            font-weight: 900;
            background: linear-gradient(135deg, #FFFFFF 0%, #FF8C00 50%, #FF4500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .login-logo .tagline {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 24px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }

        .input-group .input-icon {
            position: relative;
        }

        .input-group .input-icon span {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.6;
        }

        .input-group input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #FF4500;
            background: rgba(255, 68, 0, 0.1);
            box-shadow: 0 0 0 3px rgba(255, 68, 0, 0.2);
        }

        .remember-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 0 32px;
        }

        .remember-checkbox {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .remember-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #FF4500;
        }

        .remember-checkbox span {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-login-premium {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FF4500, #FF8C00);
            border: none;
            border-radius: 32px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        .btn-login-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 68, 0, 0.3);
        }

        .saved-user-card {
            background: rgba(255, 68, 0, 0.1);
            border: 1px solid rgba(255, 68, 0, 0.3);
            border-radius: 32px;
            padding: 16px 20px;
            margin-bottom: 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .saved-user-card:hover {
            background: rgba(255, 68, 0, 0.15);
            border-color: rgba(255, 68, 0, 0.5);
            transform: translateX(5px);
        }

        .saved-user-avatar {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #FF4500, #FF8C00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .saved-user-info {
            flex: 1;
        }

        .saved-user-name {
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            margin-bottom: 4px;
        }

        .saved-user-cpf {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .saved-user-badge {
            font-size: 11px;
            color: #FF8C00;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            position: relative;
            background: #000;
            padding: 0 16px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        .error {
            color: #f44336;
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            padding: 10px;
            background: rgba(244, 67, 54, 0.1);
            border-radius: 10px;
        }

        .login-footer {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
        }

        .motorista-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .motorista-header {
            background: #000;
            border: 1px solid #222;
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .motorista-info-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #111;
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid #222;
        }

        .motorista-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #FF4500, #FF8C00);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .motorista-details {
            display: flex;
            flex-direction: column;
        }

        .motorista-name {
            font-weight: bold;
            font-size: 15px;
        }

        .motorista-status {
            font-size: 11px;
            color: #4caf50;
        }

        .btn-logout {
            background: rgba(244, 67, 54, 0.15);
            color: #f44336;
            border: 1px solid rgba(244, 67, 54, 0.3);
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-logout:hover {
            background: rgba(244, 67, 54, 0.25);
            border-color: #f44336;
        }

        .motorista-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: #000;
            border: 1px solid #222;
            border-radius: 16px;
            padding: 20px;
        }

        .card-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #222;
        }

        .viagem-ativa {
            border: 2px solid #4caf50;
            background: linear-gradient(135deg, #0a1a0a, #000);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #222;
        }

        .info-label {
            color: #888;
            font-size: 13px;
        }

        .info-value {
            font-weight: 600;
            font-size: 14px;
            text-align: right;
        }

        .btn-primary {
            background: linear-gradient(135deg, #fff, #e0e0e0);
            color: #000;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-success {
            background: linear-gradient(135deg, #4caf50, #2e7d32);
            color: #fff;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        .btn-secondary {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .viagem-item {
            background: #111;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 1px solid #222;
        }

        .viagem-item.selected {
            border-color: #FF4500;
            background: #1a1a1a;
        }

        .viagem-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .viagem-cliente {
            font-weight: bold;
            font-size: 15px;
        }

        .viagem-status {
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: #ff9800;
            color: #000;
        }

        .status-pendente {
            background: #ff9800;
            color: #000;
        }

        #map {
            height: 300px;
            border-radius: 12px;
            margin-top: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #000;
            border: 1px solid #333;
            border-radius: 24px;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: center;
        }

        .modal-content h3 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        #qr-reader {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 15px;
            border-radius: 16px;
            overflow: hidden;
        }

        #qr-reader video {
            width: 100% !important;
            height: auto !important;
        }

        .modal-content input {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            text-align: center;
            font-family: monospace;
            letter-spacing: 3px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 12px;
            margin: 15px 0;
        }

        .foto-buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .foto-buttons .btn-secondary {
            flex: 1;
        }

        .foto-preview {
            max-width: 100%;
            max-height: 150px;
            object-fit: contain;
            border-radius: 12px;
            display: none;
            margin: 10px auto;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #FF4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width:768px) {
            .motorista-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 15px;
                width: 95%;
            }

            .modal-buttons {
                flex-direction: column;
            }
        }
    </style>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="./firebase-config.js"></script>
</head>

<body>
    <div id="loginContainer" class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">🚛</div>
                <h1>BLACK TOW</h1>
                <div class="tagline">Motorista Profissional</div>
            </div>
            <div id="savedUserContainer" style="display:none;"></div>
            <div class="input-group"><label>CPF</label>
                <div class="input-icon"><span>📄</span><input type="text" id="loginCpf" placeholder="000.000.000-00">
                </div>
            </div>
            <div class="input-group"><label>SENHA</label>
                <div class="input-icon"><span>🔒</span><input type="password" id="loginSenha" placeholder="••••••">
                </div>
            </div>
            <div class="remember-container"><label class="remember-checkbox"><input type="checkbox"
                        id="rememberCheckbox"><span>Lembrar de mim</span></label></div>
            <button class="btn-login-premium" id="btnLogin">ENTRAR NO SISTEMA →</button>
            <div id="loginError" class="error"></div>
            <div class="login-footer">BLACK TOW - Sistema de Guincho 24h</div>
        </div>
    </div>
    <div id="appContainer" style="display:none;">
        <div class="motorista-container">
            <div class="motorista-header">
                <div class="logo">BLACK TOW</div>
                <div class="motorista-info-card">
                    <div class="motorista-avatar">🚛</div>
                    <div class="motorista-details"><span class="motorista-name"
                            id="motoristaNome">Carregando...</span><span class="motorista-status">● Online</span></div>
                </div><button class="btn-logout" id="btnLogout">Sair</button>
            </div>
            <div class="motorista-grid">
                <div class="card viagem-ativa">
                    <div class="card-header">🚛 VIAGEM ATIVA</div>
                    <div id="viagemAtivaContent">
                        <p style="color:#666;">Nenhuma viagem em andamento</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">📋 PRÓXIMAS VIAGENS</div>
                    <div id="proximasViagens" style="max-height:400px;overflow-y:auto;">
                        <p style="color:#666;">Carregando...</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">🗺️ ROTA</div>
                <div id="map"></div>
                <div id="mapInfo" style="margin-top:10px;font-size:12px;color:#888;"></div>
            </div>
        </div>
    </div>
    <div id="qrModal" class="modal">
        <div class="modal-content">
            <h3>✅ FINALIZAR VIAGEM</h3>
            <p>Escaneie o QR Code do cliente</p>
            <div id="qr-reader"></div>
            <input type="text" id="codigoInput" placeholder="Código de 9 dígitos" maxlength="9">
            <div class="foto-buttons">
                <button class="btn-secondary" id="btnAbrirCamera">📷 TIRAR FOTO</button>
                <button class="btn-secondary" id="btnSelecionarFoto">🖼️ GALERIA</button>
            </div>
            <input type="file" id="fotoInput" accept="image/*" style="display:none;">
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
            <img id="fotoPreview" class="foto-preview">
            <div class="modal-buttons">
                <button class="btn-secondary" id="btnCancelarModal">CANCELAR</button>
                <button class="btn-success" id="btnConfirmarFinalizar">FINALIZAR</button>
            </div>
        </div>
    </div>
    <script>
        let motoristaLogado = null, viagensAtribuidas = [], viagemSelecionada = null, viagemAtiva = null, map, currentRoute = null, fotoBase64 = null, html5QrCode = null;
        function esperarFirebase() { return new Promise((resolve) => { if (typeof db !== 'undefined' && db) resolve(); else { const ci = setInterval(() => { if (typeof db !== 'undefined' && db) { clearInterval(ci); resolve(); } }, 100); } }); }
        function salvarSessao(m) { localStorage.setItem('blacktow_motorista_sessao', JSON.stringify({ id: m.id, nome: m.nome, cpf: m.cpf, senha: m.senha })); }
        function carregarSessao() { const s = localStorage.getItem('blacktow_motorista_sessao'); return s ? JSON.parse(s) : null; }
        function limparSessao() { localStorage.removeItem('blacktow_motorista_sessao'); }
        async function tentarLoginAutomatico() { const s = carregarSessao(); if (!s) return false; try { const snap = await db.collection('motoristas').where('cpf', '==', s.cpf).where('senha', '==', s.senha).where('status', '==', 'ativo').get(); if (!snap.empty) { motoristaLogado = { id: snap.docs[0].id, ...snap.docs[0].data() }; mostrarApp(); return true; } } catch (e) { } return false; }
        function mostrarUsuariosSalvos() { const s = localStorage.getItem('blacktow_motorista_sessao'); if (s) { const sessao = JSON.parse(s); document.getElementById('savedUserContainer').innerHTML = `<div class="saved-user-card" id="quickLoginBtn"><div class="saved-user-avatar">🚛</div><div class="saved-user-info"><div class="saved-user-name">${sessao.nome || 'Motorista'}</div><div class="saved-user-cpf">${sessao.cpf}</div></div><div class="saved-user-badge">⚡ Clique para entrar</div></div><div class="divider"><span>ou faça login com outro usuário</span></div>`; document.getElementById('savedUserContainer').style.display = 'block'; document.getElementById('quickLoginBtn').addEventListener('click', async () => { document.getElementById('loginError').textContent = ''; document.getElementById('btnLogin').disabled = true; document.getElementById('btnLogin').textContent = 'ENTRANDO...'; try { const snap = await db.collection('motoristas').where('cpf', '==', sessao.cpf).where('senha', '==', sessao.senha).where('status', '==', 'ativo').get(); if (!snap.empty) { motoristaLogado = { id: snap.docs[0].id, ...snap.docs[0].data() }; if (document.getElementById('rememberCheckbox').checked) salvarSessao(motoristaLogado); mostrarApp(); } else { document.getElementById('loginError').textContent = 'Sessão expirada.'; limparSessao(); } } catch (e) { document.getElementById('loginError').textContent = 'Erro ao fazer login.'; } document.getElementById('btnLogin').disabled = false; document.getElementById('btnLogin').textContent = 'ENTRAR NO SISTEMA →'; }); } }
        function initMap() { map = L.map('map').setView([-14.2350, -51.9253], 4); L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap', subdomains: 'abcd', maxZoom: 19 }).addTo(map); }
        function adicionarMarcadores(waypoints) { if (window.markers) window.markers.forEach(m => map.removeLayer(m)); window.markers = []; const icones = { origem: L.divIcon({ html: '🚛', className: 'marker-icon', iconSize: [30, 30] }), cliente: L.divIcon({ html: '📍', className: 'marker-icon', iconSize: [30, 30] }), destino: L.divIcon({ html: '🏁', className: 'marker-icon', iconSize: [30, 30] }) }; waypoints.forEach(p => { const m = L.marker([p.lat, p.lon], { icon: icones[p.tipo] || icones.origem }).bindPopup(`<strong>${p.label}</strong><br>${p.endereco?.substring(0, 60) || ''}`).addTo(map); window.markers.push(m); }); }
        async function geocodificar(endereco) { if (!endereco) throw new Error('Endereço vazio'); const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco + ', Brasil')}&limit=1`; const resp = await fetch(url, { headers: { 'User-Agent': 'BlackTow/1.0' } }); const data = await resp.json(); if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), display_name: data[0].display_name }; throw new Error('Endereço não encontrado'); }
        async function carregarViagens() { try { const snap = await db.collection('viagens').where('motoristaId', '==', motoristaLogado.id).get(); viagensAtribuidas = []; snap.forEach(doc => { viagensAtribuidas.push({ id: doc.id, ...doc.data() }); }); viagensAtribuidas.sort((a, b) => { const da = a.dataCriacao ? new Date(a.dataCriacao) : new Date(0); const db = b.dataCriacao ? new Date(b.dataCriacao) : new Date(0); return db - da; }); viagemAtiva = viagensAtribuidas.find(v => v.status === 'em_andamento'); atualizarInterface(); } catch (e) { } }
        async function desenharRotaViagem(viagem) { if (!map) return; try { const coordOrigem = await geocodificar(viagem.origem); const coordCliente = await geocodificar(viagem.clienteLocal); let waypointsCoords, waypointsInfo; if (viagem.tipo === 'reboque') { const coordDestino = await geocodificar(viagem.destino); waypointsCoords = [coordOrigem, coordCliente, coordDestino, coordOrigem]; waypointsInfo = [{ ...coordOrigem, tipo: 'origem', label: '🚛 GUINCHO', endereco: viagem.origem }, { ...coordCliente, tipo: 'cliente', label: '📍 CLIENTE', endereco: viagem.clienteLocal }, { ...coordDestino, tipo: 'destino', label: '🏁 DESTINO', endereco: viagem.destino }, { ...coordOrigem, tipo: 'volta', label: '🏠 RETORNO', endereco: viagem.origem }]; } else { waypointsCoords = [coordOrigem, coordCliente, coordOrigem]; waypointsInfo = [{ ...coordOrigem, tipo: 'origem', label: '🚛 GUINCHO', endereco: viagem.origem }, { ...coordCliente, tipo: 'cliente', label: '📍 CLIENTE', endereco: viagem.clienteLocal }, { ...coordOrigem, tipo: 'volta', label: '🏠 RETORNO', endereco: viagem.origem }]; } const coords = waypointsCoords.map(w => `${w.lon},${w.lat}`).join(';'); const url = `https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson`; const resp = await fetch(url); const data = await resp.json(); if (data.routes && data.routes.length > 0) { if (currentRoute) map.removeLayer(currentRoute); currentRoute = L.geoJSON(data.routes[0].geometry, { style: { color: '#FF4500', weight: 4, opacity: 0.8 } }).addTo(map); map.fitBounds(currentRoute.getBounds(), { padding: [50, 50] }); adicionarMarcadores(waypointsInfo); document.getElementById('mapInfo').innerHTML = `📏 ${(data.routes[0].distance / 1000).toFixed(1)} km | ⏱️ ${Math.round(data.routes[0].duration / 60)} min`; } } catch (e) { document.getElementById('mapInfo').innerHTML = '❌ Erro ao carregar rota'; } }
        function atualizarInterface() { const proximas = viagensAtribuidas.filter(v => v.status === 'pendente'); const container = document.getElementById('proximasViagens'); if (proximas.length === 0) { container.innerHTML = '<p style="color:#666;">✅ Nenhuma viagem pendente</p>'; } else { container.innerHTML = proximas.map(v => `<div class="viagem-item ${viagemSelecionada?.id === v.id ? 'selected' : ''}" data-id="${v.id}"><div class="viagem-header"><span class="viagem-cliente">${v.cliente || '-'}</span><span class="viagem-status status-pendente">Pendente</span></div><div>🚗 ${v.veiculo || '-'}</div><div>🔧 ${v.tipo || '-'}${v.subtipo ? ` (${v.subtipo})` : ''}</div><div>📍 ${v.clienteLocal ? v.clienteLocal.substring(0, 35) : '-'}</div><div>⏱️ Previsto: ${v.tempoPrevisto || 0} min</div></div>`).join(''); document.querySelectorAll('.viagem-item').forEach(el => { el.addEventListener('click', () => { const id = el.dataset.id; viagemSelecionada = viagensAtribuidas.find(v => v.id === id); atualizarInterface(); }); }); } const ativaContent = document.getElementById('viagemAtivaContent'); if (viagemAtiva) { ativaContent.innerHTML = `<div class="info-row"><span class="info-label">👤 Cliente:</span><span class="info-value">${viagemAtiva.cliente || '-'}</span></div><div class="info-row"><span class="info-label">📞 Telefone:</span><span class="info-value">${viagemAtiva.telefone || '-'}</span></div><div class="info-row"><span class="info-label">🚗 Veículo:</span><span class="info-value">${viagemAtiva.veiculo || '-'}</span></div><div class="info-row"><span class="info-label">📍 Local:</span><span class="info-value">${viagemAtiva.clienteLocal || '-'}</span></div><div class="info-row"><span class="info-label">🏁 Destino:</span><span class="info-value">${viagemAtiva.destino || '-'}</span></div><div class="info-row"><span class="info-label">⏱️ Tempo previsto:</span><span class="info-value">${viagemAtiva.tempoPrevisto || 0} minutos</span></div><button class="btn-success" id="btnFinalizarViagem">✅ FINALIZAR VIAGEM</button>`; document.getElementById('btnFinalizarViagem')?.addEventListener('click', abrirModalFinalizar); desenharRotaViagem(viagemAtiva); } else { ativaContent.innerHTML = '<p style="color:#666;">Nenhuma viagem em andamento</p>'; if (map && currentRoute) map.removeLayer(currentRoute); } const existingBtn = document.getElementById('btnIniciarInjected'); if (viagemSelecionada && viagemSelecionada.status === 'pendente') { if (!existingBtn) { const btn = document.createElement('button'); btn.id = 'btnIniciarInjected'; btn.className = 'btn-primary'; btn.style.width = '100%'; btn.style.marginTop = '15px'; btn.innerHTML = '🚀 INICIAR VIAGEM SELECIONADA'; btn.onclick = iniciarViagem; document.getElementById('proximasViagens').parentElement.appendChild(btn); } } else if (existingBtn) { existingBtn.remove(); } }
        async function iniciarViagem() { if (!viagemSelecionada) { alert('Selecione uma viagem!'); return; } if (viagemSelecionada.status !== 'pendente') { alert('Esta viagem não pode ser iniciada!'); return; } try { await db.collection('viagens').doc(viagemSelecionada.id).update({ status: 'em_andamento' }); await carregarViagens(); alert(`✅ Viagem iniciada! Tempo previsto: ${viagemAtiva?.tempoPrevisto || 0} minutos`); } catch (e) { alert('Erro ao iniciar viagem.'); } }
        function abrirModalFinalizar() { if (!viagemAtiva) { alert('Nenhuma viagem ativa!'); return; } fotoBase64 = null; document.getElementById('codigoInput').value = ''; document.getElementById('fotoPreview').style.display = 'none'; document.getElementById('fotoPreview').src = ''; document.getElementById('qrModal').style.display = 'flex'; if (html5QrCode) { html5QrCode.stop().catch(() => { }); } html5QrCode = new Html5Qrcode("qr-reader"); html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, (decodedText) => { document.getElementById('codigoInput').value = decodedText; html5QrCode.stop(); }, (error) => { }).catch(err => { }); }
        function fecharModal() { if (html5QrCode) { html5QrCode.stop().catch(() => { }); } document.getElementById('qrModal').style.display = 'none'; }
        async function confirmarFinalizacao() { const codigo = document.getElementById('codigoInput').value; if (!codigo) { alert('Digite ou escaneie o código de finalização!'); return; } if (!fotoBase64) { alert('Tire uma foto do veículo como comprovante!'); return; } if (codigo !== viagemAtiva.codigoValidacao) { alert('❌ Código inválido! Verifique com o cliente.'); return; } const criacao = new Date(viagemAtiva.dataCriacao); const agora = new Date(); const minutos = Math.floor((agora - criacao) / 60000); const atrasado = minutos > (viagemAtiva.tempoPrevisto + 5); try { await db.collection('viagens').doc(viagemAtiva.id).update({ status: 'concluida', fotoComprovante: fotoBase64, concluidoEm: agora.toISOString(), atrasado: atrasado }); fecharModal(); await carregarViagens(); alert('✅ Viagem finalizada com sucesso!'); } catch (e) { alert('Erro ao finalizar viagem.'); } }
        function mostrarApp() { document.getElementById('loginContainer').style.display = 'none'; document.getElementById('appContainer').style.display = 'block'; document.getElementById('motoristaNome').textContent = motoristaLogado.nome; initMap(); carregarViagens(); }
        document.getElementById('btnLogin').addEventListener('click', async () => { const cpf = document.getElementById('loginCpf').value.trim(); const senha = document.getElementById('loginSenha').value; const lembrar = document.getElementById('rememberCheckbox').checked; if (!cpf || !senha) { document.getElementById('loginError').textContent = 'Preencha CPF e senha!'; return; } document.getElementById('loginError').textContent = ''; document.getElementById('btnLogin').disabled = true; document.getElementById('btnLogin').textContent = 'ENTRANDO...'; try { const snap = await db.collection('motoristas').where('cpf', '==', cpf).where('senha', '==', senha).where('status', '==', 'ativo').get(); if (!snap.empty) { motoristaLogado = { id: snap.docs[0].id, ...snap.docs[0].data() }; if (lembrar) salvarSessao(motoristaLogado); mostrarApp(); } else { document.getElementById('loginError').textContent = 'CPF ou senha inválidos!'; } } catch (e) { document.getElementById('loginError').textContent = 'Erro ao conectar ao banco.'; } document.getElementById('btnLogin').disabled = false; document.getElementById('btnLogin').textContent = 'ENTRAR NO SISTEMA →'; });
        document.getElementById('btnLogout').addEventListener('click', () => { limparSessao(); motoristaLogado = null; document.getElementById('loginContainer').style.display = 'flex'; document.getElementById('appContainer').style.display = 'none'; document.getElementById('loginCpf').value = ''; document.getElementById('loginSenha').value = ''; document.getElementById('rememberCheckbox').checked = false; document.getElementById('loginError').textContent = ''; location.reload(); });
        document.getElementById('btnAbrirCamera').addEventListener('click', () => { document.getElementById('cameraInput').click(); });
        document.getElementById('btnSelecionarFoto').addEventListener('click', () => { document.getElementById('fotoInput').click(); });
        function processarFoto(file) { if (file) { const reader = new FileReader(); reader.onload = function (ev) { fotoBase64 = ev.target.result; const preview = document.getElementById('fotoPreview'); preview.src = fotoBase64; preview.style.display = 'block'; }; reader.readAsDataURL(file); } }
        document.getElementById('cameraInput').addEventListener('change', (e) => { if (e.target.files && e.target.files[0]) processarFoto(e.target.files[0]); });
        document.getElementById('fotoInput').addEventListener('change', (e) => { if (e.target.files && e.target.files[0]) processarFoto(e.target.files[0]); });
        document.getElementById('btnCancelarModal').addEventListener('click', fecharModal);
        document.getElementById('btnConfirmarFinalizar').addEventListener('click', confirmarFinalizacao);
        async function init() { await esperarFirebase(); mostrarUsuariosSalvos(); const auto = await tentarLoginAutomatico(); if (!auto) document.getElementById('loginContainer').style.display = 'flex'; }
        init();
    </script>
